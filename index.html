</style></head><body><div class="app"><nav class="sb"><h1>Meu Din Din</h1><small>Controle financeiro pessoal · protótipo</small><div id="nav" style="display:contents"></div><a id="pf" data-a="perfil"></a></nav><main id="main"></main></div><div id="au" hidden></div><div id="m" hidden></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),K='meudindin_proto_v1',pad=n=>String(n).padStart(2,'0');
const D=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,TD=D(new Date()),BR=d=>d?d.split('-').reverse().join('/'):'';
const SY={BRL:'R$',USD:'US$',EUR:'€'},M=v=>(v<0?'-':'')+(SY[(S.prof||{}).cur]||'R$')+' '+(Math.abs(v)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const C=s=>{const n=parseFloat(String(s||'').replace(/\./g,'').replace(',','.'));return isNaN(n)?0:Math.round(n*100)},F=c=>(c/100).toFixed(2).replace('.',',');
const id=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=(y,m,d)=>{const t=new Date(y,m,1),l=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return D(new Date(t.getFullYear(),t.getMonth(),Math.min(d,l)))};
const addM=(d,n)=>{const [y,m,dd]=d.split('-').map(Number);return mk(y,m-1+n,dd)};
const PAL=[['#10b981','Verde'],['#3b82f6','Azul'],['#f59e0b','Laranja'],['#ef4444','Vermelho'],['#8b5cf6','Roxo'],['#ec4899','Rosa'],['#14b8a6','Turquesa'],['#94a3b8','Cinza']];
let S;
S=S||{banks:[],accs:[],cats:[{id:'c1',name:'Impostos',type:'despesa',color:'#f59e0b',subs:[{id:'s1',name:'IPVA'},{id:'s2',name:'IPTU'}]},{id:'c2',name:'Salário',type:'receita',color:'#10b981',subs:[]},{id:'c3',name:'Rendimentos',type:'receita',color:'#3b82f6',subs:[]}],pays:['PIX','Dinheiro','Cartão de Débito','Cartão de Crédito'].map(name=>({id:id(),name})),types:[{id:'receita',name:'Receita',effect:'in',sys:1},{id:'despesa',name:'Despesa',effect:'out',sys:1},{id:'transferencia',name:'Transferência',effect:'move',sys:1}],cards:[],tx:[],assets:[],bh:[],paidInv:{},theme:matchMedia('(prefers-color-scheme: light)').matches?'light':'dark',tab:'dash',cfg:'cats',ct:'despesa',ym:TD.slice(0,7),ycat:'c3'};
const save=()=>{cloud()};
const toast=m=>{$('#t').textContent=m;setTimeout(()=>$('#t').textContent='',3500)};
const an=i=>(S.accs.find(a=>a.id==i)||{name:'—'}).name,eff=t=>(S.types.find(x=>x.id==t)||{}).effect;
const shift=(ym,n)=>addM(ym+'-01',n).slice(0,7);
const dl=(t,a)=>{if(t.card)return 0;const e=eff(t.type);if(e=='move')return t.acc==a?-t.v:t.to==a?t.v:0;if(t.acc!=a)return 0;return e=='in'?t.v:-t.v};
function invs(){const o={};S.tx.filter(t=>t.card).forEach(t=>{const c=S.cards.find(x=>x.id==t.card);if(!c)return;const [y,m,d]=t.due.split('-').map(Number),cm=m-1+(d>c.close?1:0),due=mk(y,cm+(c.due>c.close?0:1),c.due),k=c.id+due;o[k]=o[k]||{card:c,due,v:0,n:0};o[k].v+=t.v;o[k].n++});return Object.values(o).sort((a,b)=>a.due<b.due?-1:1)}
const open=i=>!S.paidInv[i.card.id+i.due];
const pend=()=>[...S.tx.filter(t=>!t.paid&&!t.card).map(t=>({t,desc:t.desc,v:t.v,due:t.due,e:eff(t.type)})),...invs().filter(open).map(i=>({inv:i,desc:'Fatura '+i.card.name,v:i.v,due:i.due,e:'out'}))];
const conf=a=>(S.accs.find(x=>x.id==a).ini||0)+S.tx.filter(t=>t.paid).reduce((s,t)=>s+dl(t,a),0);
const proj=a=>conf(a)+S.tx.filter(t=>!t.paid).reduce((s,t)=>s+dl(t,a),0)-invs().filter(i=>open(i)&&i.card.acc==a).reduce((s,i)=>s+i.v,0);
const grp=l=>{const o={};l.forEach(t=>{const c=S.cats.find(x=>x.id==t.cat),n=c?c.name:'Sem Categoria';o[n]=o[n]||{n,v:0,color:c?c.color:'#94a3b8'};o[n].v+=t.v});return Object.values(o).sort((a,b)=>b.v-a.v)};
const pie=d=>{const T=d.reduce((s,x)=>s+x.v,0);if(!T)return '<p class="mu">Sem lançamentos no período.</p>';let a=0;const L=2*Math.PI*40;return `<div class="pi"><svg viewBox="0 0 100 100" width="150" height="150">${d.map(x=>{const l=x.v/T*L,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${x.color}" stroke-width="18" stroke-dasharray="${l} ${L-l}" stroke-dashoffset="${-a}" transform="rotate(-90 50 50)"/>`;a+=l;return s}).join('')}</svg><div class="f">${d.map(x=>`<div class="r"><i style="background:${x.color}"></i><span class="f">${esc(x.n)}</span><span class="mu">${(x.v/T*100).toFixed(1)}%</span><b>${M(x.v)}</b></div>`).join('')}</div></div>`};
const mnav=()=>`<div class="mn"><button class="ic" data-a="ym" data-n="-1">‹</button><b>${new Date(+S.ym.slice(0,4),+S.ym.slice(5)-1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="ic" data-a="ym" data-n="1">›</button></div>`;
const hd=(t,s,x='')=>`<div class="hd"><div><h2>${t}</h2><p class="sub">${s}</p></div>${x}</div>`;
const cls=d=>d<TD?'ov':d==TD?'td':'fu';
const row=i=>`<div class="r"><span class="dt ${cls(i.due)}">${BR(i.due)}</span><span class="f">${esc(i.desc)} ${i.due<TD?'<b class="ng">Vencido</b>':''}</span><b class="${i.e=='in'?'ps':'ng'}">${M(i.e=='in'?i.v:-i.v)}</b><button class="ic" title="Liquidar" data-a="${i.inv?'payinv':'conc'}" data-k="${i.inv?i.inv.card.id+i.inv.due:i.t.id}">✓</button></div>`;
const lst=(l,e)=>l.length?l.join(''):`<p class="mu">${e||'Nada cadastrado ainda.'}</p>`;
/* ---------- Dashboard ---------- */
function dash(){const ym=S.ym,cur=ym==TD.slice(0,7),ids=S.accs.map(a=>a.id);
const P=pend().filter(i=>i.due.slice(0,7)==ym||(cur&&i.due<ym+'-01')).sort((a,b)=>a.due<b.due?-1:1),pg=P.filter(i=>i.e=='out'),rc=P.filter(i=>i.e=='in'),sm=l=>l.reduce((s,i)=>s+i.v,0);
const pj=ids.reduce((s,a)=>s+proj(a),0),cf=ids.reduce((s,a)=>s+conf(a),0),pm=S.tx.filter(t=>!t.kind&&t.paid&&t.paid.slice(0,7)==ym),R=pm.filter(t=>eff(t.type)=='in').reduce((s,t)=>s+t.v,0),Dp=pm.filter(t=>eff(t.type)=='out').reduce((s,t)=>s+t.v,0);
const mt=S.tx.filter(t=>!t.kind&&eff(t.type)!='move'&&t.due.slice(0,7)==ym);
return hd('Dashboard','Visão geral das suas finanças',`<div style="display:flex;gap:10px;align-items:center">${mnav()}<button class="b p" data-a="new">+ Novo lançamento</button></div>`)+
`<div class="g4"><div class="card"><span class="mu">Saldo projetado</span><div class="big ${pj<0?'ng':''}">${M(pj)}</div></div><div class="card"><span class="mu">Saldo confirmado</span><div class="big ${cf<0?'ng':''}">${M(cf)}</div></div><div class="card"><span class="mu">Receitas confirmadas</span><div class="big ps">${M(R)}</div></div><div class="card"><span class="mu">Despesas confirmadas</span><div class="big ng">${M(Dp)}</div></div></div>
<div class="card"><h3>Saldos de caixa</h3><div class="r mu"><span class="f">Conta</span><span style="width:110px;text-align:right">Projetado</span><span style="width:110px;text-align:right">Confirmado</span></div>${lst(S.accs.map(a=>`<div class="r"><span class="f">${esc(a.name)}</span><span style="width:110px;text-align:right">${M(proj(a.id))}</span><span style="width:110px;text-align:right">${M(conf(a.id))}</span></div>`),'Cadastre uma conta em Configurações › Contas.')}</div>
<div class="g2"><div class="card"><div class="hd"><h3>Contas a pagar</h3><b class="ng">${M(-sm(pg))}</b></div>${lst(pg.map(row),'Nenhuma conta a pagar.')}</div><div class="card"><div class="hd"><h3>Contas a receber</h3><b class="ps">${M(sm(rc))}</b></div>${lst(rc.map(row),'Nenhuma conta a receber.')}</div></div>
<div class="g2"><div class="card"><h3>Despesas por categoria</h3>${pie(grp(mt.filter(t=>eff(t.type)=='out')))}</div><div class="card"><h3>Receitas por categoria</h3>${pie(grp(mt.filter(t=>eff(t.type)=='in')))}</div></div>`}
/* ---------- Fluxo de caixa ---------- */
function fluxo(){const ym=S.ym,cur=ym==TD.slice(0,7),fa=S.fa||'',inm=d=>d.slice(0,7)==ym;
const L=[...S.tx.filter(t=>!t.card&&(inm(t.due)||(cur&&!t.paid&&t.due<ym+'-01'))&&(!fa||t.acc==fa||t.to==fa)).map(t=>({t,due:t.due,e:eff(t.type),v:t.v,desc:t.desc||('Transferência '+an(t.acc)+' → '+an(t.to))})),...invs().filter(i=>open(i)&&(inm(i.due)||(cur&&i.due<ym+'-01'))&&(!fa||i.card.acc==fa)).map(i=>({inv:i,due:i.due,e:'out',v:i.v,desc:'Fatura '+i.card.name}))].sort((a,b)=>a.due<b.due?-1:1);
const ent=L.filter(x=>x.e=='in').reduce((s,x)=>s+x.v,0),sai=L.filter(x=>x.e=='out').reduce((s,x)=>s+x.v,0),pd=L.filter(x=>!(x.t&&x.t.paid)&&x.e!='move').reduce((s,x)=>s+(x.e=='in'?x.v:-x.v),0);
const rf=x=>{const t=x.t,st=t?(t.paid?'Confirmado':x.due<TD?'Vencido':'Previsto'):(x.due<TD?'Vencido':'Previsto'),k=t?t.id:x.inv.card.id+x.inv.due;
return `<div class="r"><span class="f">${esc(x.desc)}<br><small class="mu">${st}${t&&t.prev?' · previsto '+M(t.prev):''}${t?' · '+esc(an(t.acc)):''}</small></span><b class="${x.e=='in'?'ps':x.e=='out'?'ng':''}">${M(x.e=='out'?-x.v:x.v)}</b>${t&&t.paid&&!t.kind?`<button class="ic" title="Reabrir" data-a="reopen" data-k="${k}">↺</button>`:!t||!t.paid?`<button class="ic" title="Liquidar" data-a="${t?'conc':'payinv'}" data-k="${k}">✓</button>`:''}${t&&!t.kind?`<button class="ic" data-a="edit" data-k="${k}">✎</button><button class="ic" data-a="dup" data-k="${k}">⧉</button>`:''}${t?`<button class="ic x" data-a="del" data-k="${k}">🗑</button>`:''}</div>`};
const days=[...new Set(L.map(x=>x.due))];
return hd('Fluxo de Caixa','Lançamentos por dia de vencimento',mnav())+`<div class="card"><label class="mu">Conta <select data-c="fa" style="max-width:260px"><option value="">Todas</option>${S.accs.map(a=>`<option value="${a.id}" ${a.id==fa?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label></div>
<div class="g4"><div class="card"><span class="mu">Entradas</span><div class="big ps">${M(ent)}</div></div><div class="card"><span class="mu">Saídas</span><div class="big ng">${M(-sai)}</div></div><div class="card"><span class="mu">Resultado</span><div class="big">${M(ent-sai)}</div></div><div class="card"><span class="mu">A realizar (provisionado)</span><div class="big yl">${M(pd)}</div></div></div>
<div class="card"><h3>Detalhamento · hoje ${BR(TD)}</h3>${days.length?days.map(d=>{const g=L.filter(x=>x.due==d),n=g.reduce((s,x)=>s+(x.e=='in'?x.v:x.e=='out'?-x.v:0),0);return `<div class="dh"><b class="${cls(d)}">${BR(d)}</b><span>saldo do dia ${M(n)}</span></div>`+g.map(rf).join('')}).join(''):'<p class="mu">Nenhum lançamento neste mês. Use “+ Novo lançamento” no Dashboard.</p>'}</div>`}
/* ---------- Relatórios ---------- */
function rel(){const a=S.r1||ym0()+'-01',b=S.r2||TD,l=S.tx.filter(t=>!t.kind&&eff(t.type)!='move'&&t.due>=a&&t.due<=b),R=l.filter(t=>eff(t.type)=='in'),Dp=l.filter(t=>eff(t.type)=='out'),s=x=>x.reduce((n,t)=>n+t.v,0);

function cloud(){if(!USER||!sb)return;const js=JSON.stringify(pay());if(js==LAST)return;clearTimeout(TM);SYNC='busy';syn();TM=setTimeout(async()=>{try{const{data,error}=await sb.from('user_data').update({data:JSON.parse(js),rev:REV+1}).eq('user_id',USER.id).eq('rev',REV).select('rev');if(error)throw error;if(!data.length){SYNC='err';toast('Seus dados mudaram em outro dispositivo. Recarregando…');await pull();render();return}REV=data[0].rev;LAST=js;SYNC='ok'}catch(e){SYNC='err'}syn()},900)}
async function pull(){const{data,error}=await sb.from('user_data').select('data,rev').eq('user_id',USER.id).maybeSingle();if(error)throw error;if(!data){const r=await sb.from('user_data').insert({user_id:USER.id,data:{},rev:0});if(r.error)throw r.error;REV=0}else{REV=data.rev;S={...S,...data.data}}S.mo=0;LAST=JSON.stringify(pay());SYNC='ok'}
const TERMS={t:['Termos de Uso (versão provisória 1.0)','O Meu Din Din é um app pessoal de controle financeiro. Valores e cálculos são informativos e não substituem orientação de contador ou advogado. Você é responsável pelos dados que cadastra e por manter backups.'],p:['Política de Privacidade (versão provisória 1.0)','Seus dados financeiros ficam no banco de dados do projeto Supabase do administrador do app, separados por usuário. O e-mail é usado apenas para entrar na conta e recuperar a senha. Você pode exportar seus dados a qualquer momento.']};
function authUI(mode,msg=''){const f=(t,i,l)=>`<div class="fg"><label>${l}<input id="${i}" type="${t}"></label></div>`,ck=(i,l)=>`<p><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="${i}">${l}</label></p>`;
const B={setup:'<h3>Configuração pendente</h3><p class="mu">Preencha SUPA_URL e SUPA_KEY no início do script do arquivo, conforme o guia.</p>',
login:`<h3>Entrar</h3>${f('email','ae','E-mail')}${f('password','ap','Senha')}<p><button class="bt" data-a="aul">Entrar</button></p><p><a data-a="auw" data-k="signup">Criar conta</a> · <a data-a="auw" data-k="reset">Esqueci a senha</a></p>`,
signup:`<h3>Criar conta</h3>${f('email','ae','E-mail')}${f('password','ap','Senha (mínimo 6 caracteres)')}${ck('at','Li e aceito os <a data-a="doc" data-k="t">Termos de Uso</a>')}${ck('ay','Li e aceito a <a data-a="doc" data-k="p">Política de Privacidade</a>')}<p><button class="bt" data-a="aus">Criar conta</button></p><p><a data-a="auw" data-k="login">Já tenho conta</a></p>`,
reset:`<h3>Recuperar senha</h3>${f('email','ae','E-mail')}<p><button class="bt" data-a="aur">Enviar link</button></p><p><a data-a="auw" data-k="login">Voltar</a></p>`,
newpw:`<h3>Nova senha</h3>${f('password','ap','Nova senha')}<p><button class="bt" data-a="aun">Salvar senha</button></p>`};
$('#au').hidden=false;$('#au').innerHTML=`<div class="md" style="max-width:400px"><h2 style="margin-bottom:12px">Meu Din Din</h2>${B[mode]}<p class="ng" id="aer">${esc(msg)}</p></div>`}
async function enter(u){USER=u;try{await pull()}catch(e){USER=null;authUI('login','Não foi possível carregar seus dados: '+(e.message||e));return}$('#au').hidden=true;render()}
async function boot(){if(!sb||SUPA_URL.startsWith('COLE')||SUPA_KEY.startsWith('COLE')){authUI('setup');return}sb.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY')authUI('newpw')});const{data}=await sb.auth.getSession();if(data.session)await enter(data.session.user);else authUI('login')}
const em=()=>$('#ae').value.trim(),er=m=>{$('#aer').textContent=m;return false};
Object.assign(ACT,{auw:d=>{authUI(d.k);return false},
aul:async()=>{const{data,error}=await sb.auth.signInWithPassword({email:em(),password:$('#ap').value});if(error)return er('E-mail ou senha incorretos.');await enter(data.user);return false},
aus:async()=>{if(!$('#at').checked||!$('#ay').checked)return er('É preciso aceitar os Termos de Uso e a Política de Privacidade.');const{data,error}=await sb.auth.signUp({email:em(),password:$('#ap').value,options:{data:{terms_accepted:true,terms_version:'1.0'}}});if(error)return er(error.message);if(data.session)await enter(data.user);else authUI('login','Conta criada. Confirme o e-mail enviado e entre.');return false},
aur:async()=>{const{error}=await sb.auth.resetPasswordForEmail(em(),{redirectTo:location.origin+location.pathname});er(error?error.message:'Se o e-mail existir, você receberá um link.');return false},
aun:async()=>{const{error}=await sb.auth.updateUser({password:$('#ap').value});if(error)return er(error.message);const{data}=await sb.auth.getSession();await enter(data.session.user);return false},
doc:d=>{const x=TERMS[d.k];$('#au').innerHTML=`<div class="md" style="max-width:480px"><h3>${x[0]}</h3><p>${x[1]}</p><p><button class="b" data-a="auw" data-k="signup">Voltar</button></p></div>`;return false},
logout:async()=>{await sb.auth.signOut();location.reload();return false},
chpw:()=>{S.mo=0;render();form('Alterar senha',[{k:'p1',l:'Nova senha',t:'p',w:'fw'},{k:'p2',l:'Repita a nova senha',t:'p',w:'fw'}],{p1:'',p2:''},v=>{if(v.p1.length<6)return 'Mínimo de 6 caracteres.';if(v.p1!=v.p2)return 'As senhas não conferem.';sb.auth.updateUser({password:v.p1}).then(r=>toast(r.error?r.error.message:'Senha alterada.'))});return false},
bkp:()=>{const b=new Blob([JSON.stringify({app:'meu-din-din',v:1,at:new Date().toISOString(),data:pay()},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meu-din-din-backup-'+TD+'.json';a.click();return false},
reset:()=>{ask('Apagar todos os lançamentos, contas, bancos e cartões?',()=>{Object.assign(S,{tx:[],accs:[],banks:[],cards:[],assets:[],bh:[],paidInv:{}});render()});return false},
atu:async()=>{const t=S.cotab,cm=S.cmp||'BRL';if(t!='cambio'&&t!='cripto'){toast('Esta aba ainda não tem fonte de dados.');return false}try{if(t=='cambio'){const j=await(await fetch('https://open.er-api.com/v6/latest/'+cm)).json();if(j.result!='success')throw 0;Q.cambio={base:cm,at:j.time_last_update_utc,rates:j.rates}}else{const j=await(await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency='+cm.toLowerCase()+'&ids=bitcoin,ethereum,tether,binancecoin,solana,ripple&price_change_percentage=24h')).json();if(!Array.isArray(j))throw 0;Q.cripto={base:cm,rows:j}}Q.err=''}catch(e){Q.err='Não foi possível atualizar agora.'}render();return false}});
CH.rst=(v,el)=>{const f=el.files[0];if(!f)return;f.text().then(t=>{let j;try{j=JSON.parse(t)}catch(e){return toast('Arquivo inválido.')}const d=j&&j.app=='meu-din-din'&&j.data;if(!d||!Array.isArray(d.tx)||!Array.isArray(d.accs)||!Array.isArray(d.cats))return toast('Backup inválido: estrutura não reconhecida.');ask('Restaurar este backup? Isso substitui os dados atuais.',()=>{S={...S,...d};S.mo=0;render()})})};
const _cot=cot;cot=function(){let h=_cot().replace('data-a="tst" data-m="Sem fonte de dados nesta versão de teste."','data-a="atu"');const t=S.cotab;if(t!='cripto'&&t!='cambio')return h;const cm=S.cmp||'BRL',q=Q[t]&&Q[t].base==cm?Q[t]:null,fx=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4}),dt=s=>s?new Date(s).toLocaleString('pt-BR'):'—';let head,rows;
if(t=='cambio'){head=['Moeda','Cotação ('+cm+')','Atualização'];rows=[['Dólar americano','USD'],['Euro','EUR'],['Libra esterlina','GBP'],['Iene japonês','JPY'],['Peso argentino','ARS']].filter(x=>x[1]!=cm).map(([n,c])=>[n,c,q&&q.rates[c]?fx(1/q.rates[c]):'—',q?dt(q.at):'—'])}
else{head=['Ativo','Preço ('+cm+')','24h','Atualização'];rows=q?q.rows.map(p=>[p.name,p.symbol.toUpperCase(),fx(p.current_price),p.price_change_percentage_24h==null?'—':(p.price_change_percentage_24h>0?'+':'')+p.price_change_percentage_24h.toFixed(2)+'%',dt(p.last_updated)]):[]}
const tbl=`<div class="card" style="padding:0;overflow-x:auto"><div class="r th" style="padding:12px 20px">${head.map((x,i)=>`<span class="${i?'':'f'}" style="${i?'width:150px;flex:none':''}">${x}</span>`).join('')}</div>${rows.map(([n,c,...cs])=>`<div class="r" style="padding:12px 20px"><span class="f"><b>${esc(n)}</b><br><small class="mu">${esc(c)}</small></span>${cs.map(x=>`<span style="width:150px;flex:none">${esc(x)}</span>`).join('')}</div>`).join('')||'<div class="emp">Clique em Atualizar para buscar as cotações.</div>'}</div>`;
return h.replace(/<div class="card" style="padding:0;overflow-x:auto">[\s\S]*?<\/div><\/div>(?=<div class="card" style="margin-top:12px">)/,()=>tbl).replace(/<div class="card" style="margin-top:12px"><b>Fonte de cotações não conectada<\/b>[\s\S]*?<\/div>$/,()=>`<div class="card" style="margin-top:12px"><small class="mu">Fonte: ${t=='cambio'?'open.er-api.com':'CoinGecko'}. Os dados podem ter atraso. ${Q.err||''}</small></div>`)};
boot();
</script></body></html>
